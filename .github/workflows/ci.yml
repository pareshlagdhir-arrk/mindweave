name: Rust desktop checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p mindweave-desktop --release
      - uses: actions/upload-artifact@v4
        with:
          name: mindweave-unsigned-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/mindweave
            target/release/mindweave.exe
          if-no-files-found: error
