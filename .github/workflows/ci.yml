name: Rust desktop checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # What gpui (X11, Wayland, Vulkan, fonts) and the file dialogs (GTK)
      # build against on Linux.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig1-dev libfreetype6-dev libssl-dev libgtk-3-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p mindweave-desktop -p mindweave-mcp --release
      # The install scripts, into a temporary folder (the build is reused).
      - if: runner.os != 'Windows'
        run: scripts/install.sh
        env:
          MINDWEAVE_APP_DIR: ${{ runner.temp }}/apps
          MINDWEAVE_BIN_DIR: ${{ runner.temp }}/bin
      - if: runner.os != 'Windows'
        run: test -x "$RUNNER_TEMP/bin/mindweave-mcp" && ls -R "$RUNNER_TEMP/apps"
      - if: runner.os == 'Windows'
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install.ps1
          if (-not (Test-Path "$env:RUNNER_TEMP\apps\mindweave.exe")) { exit 1 }
          if (-not (Test-Path "$env:RUNNER_TEMP\bin\mindweave-mcp.exe")) { exit 1 }
        shell: pwsh
        env:
          MINDWEAVE_APP_DIR: ${{ runner.temp }}/apps
          MINDWEAVE_BIN_DIR: ${{ runner.temp }}/bin
          MINDWEAVE_NO_SHORTCUT: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: mindweave-unsigned-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/mindweave${{ runner.os == 'Windows' && '.exe' || '' }}
            target/release/mindweave-mcp${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
