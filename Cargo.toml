[workspace]
resolver = "2"
members = ["crates/mindweave-core", "crates/mindweave-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gpui-kit = { version = "=0.8.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
dirs = "6"
rfd = "0.15"
tempfile = "3"
trash = "=5.2.9"
libc = "=0.2.191"
roxmltree = "=0.21.1"
svgtypes = "=0.16.1"
toml = "=1.1.8"
