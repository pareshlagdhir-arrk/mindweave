[workspace]
resolver = "2"
members = ["crates/mindweave-core", "crates/mindweave-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gpui-kit = { version = "=0.8.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
dirs = "6"
rfd = "0.15"
tempfile = "3"
trash = "=5.2.9"
libc = "=0.2.191"
roxmltree = "=0.21.1"
svgtypes = "=0.16.1"
toml = "=1.1.8"
unicode-segmentation = "=1.13.3"
base64 = "=0.22.1"
zip = { version = "=2.2.0", default-features = false, features = ["deflate"] }
# The version gpui uses: the canvas builds pictures (the dot pattern's
# tile) as its frames.
image = { version = "=0.25.10", default-features = false }
# The version gpui uses: rotated text is drawn from its glyph outlines.
font-kit = { package = "zed-font-kit", version = "=0.14.1-zed", default-features = false, features = ["source"] }
# Equation rendering (LaTeX and mhchem to SVG with embedded glyphs).
ratex-parser = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-types = "=0.1.15"
ratex-svg = { version = "=0.1.15", features = ["standalone", "embed-fonts"] }
