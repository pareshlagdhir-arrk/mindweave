[[shape]]
id = "rectangle"
name = "Rectangle"
icon = "square"
default_size = [120, 80]
primitive = "rect"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5, opacity = 1.0 }

[[shape.param]]
key = "corner_radius"
label = "Corner radius"
min = 0
max = 1000
step = 1
default = 0

[[shape]]
id = "ellipse"
name = "Ellipse"
icon = "circle"
default_size = [120, 80]
primitive = "ellipse"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5, opacity = 1.0 }

[[shape]]
id = "line"
name = "Line"
icon = "minus"
default_size = [120, 60]
primitive = "line"
style = { fill = "none", stroke = "auto", stroke_width = 2, opacity = 1.0 }

[[shape]]
id = "triangle"
name = "Triangle"
icon = "triangle"
default_size = [120, 80]
