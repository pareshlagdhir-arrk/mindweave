# The built-in UML library (format 2): class, activity and sequence
# diagram elements. Items appear in the ribbon in this order. Template
# parts are stored in documents by number, so never reorder them; add new
# parts at the end.

# Class diagrams

[[template]]
id = "class"
name = "Class"
icon = "shapes/icons/class.svg"
default_size = [180, 140]

[[template.part]]
frame = [0, 0, 180, 28]
primitive = "rect"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5 }
label = { text = "ClassName", bold = true, size = 12 }

[[template.part]]
frame = [0, 28, 180, 56]
primitive = "rect"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5 }
label = { text = "+ attribute: Type", align = "left", valign = "top", size = 11 }

[[template.part]]
frame = [0, 84, 180, 56]
primitive = "rect"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5 }
label = { text = "+ operation(): Type", align = "left", valign = "top", size = 11 }

[[template]]
id = "interface"
name = "Interface"
icon = "shapes/icons/interface.svg"
default_size = [180, 100]

[[template.part]]
frame = [0, 0, 180, 40]
primitive = "rect"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5 }
label = { text = "«interface»\nInterfaceName", bold = true, size = 12 }

[[template.part]]
frame = [0, 40, 180, 60]
primitive = "rect"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5 }
label = { text = "+ operation(): Type", align = "left", valign = "top", size = 11 }

[[template]]
id = "abstract-class"
name = "Abstract Class"
icon = "shapes/icons/abstract-class.svg"
default_size = [180, 140]

[[template.part]]
frame = [0, 0, 180, 28]
primitive = "rect"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5 }
label = { text = "AbstractClass", bold = true, italic = true, size = 12 }

[[template.part]]
frame = [0, 28, 180, 56]
primitive = "rect"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5 }
label = { text = "+ attribute: Type", align = "left", valign = "top", size = 11 }

[[template.part]]
frame = [0, 84, 180, 56]
primitive = "rect"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5 }
label = { text = "+ operation(): Type", align = "left", valign = "top", size = 11 }

[[template]]
id = "enumeration"
name = "Enumeration"
icon = "shapes/icons/enumeration.svg"
default_size = [180, 100]

[[template.part]]
frame = [0, 0, 180, 40]
primitive = "rect"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5 }
label = { text = "«enumeration»\nEnumName", bold = true, size = 12 }

[[template.part]]
frame = [0, 40, 180, 60]
primitive = "rect"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5 }
label = { text = "LITERAL_ONE\nLITERAL_TWO", align = "left", valign = "top", size = 11 }

[[template]]
id = "object"
name = "Object"
icon = "shapes/icons/object.svg"
default_size = [180, 84]

[[template.part]]
frame = [0, 0, 180, 28]
primitive = "rect"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5 }
label = { text = "object : Class", underline = true, size = 12 }

[[template.part]]
frame = [0, 28, 180, 56]
primitive = "rect"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5 }
label = { text = "attribute = value", align = "left", valign = "top", size = 11 }

[[shape]]
id = "package"
name = "Package"
icon = "folder"
default_size = [160, 120]
svg = "shapes/package.svg"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5, opacity = 1.0 }

[[shape]]
id = "note"
name = "Note"
icon = "sticky-note"
default_size = [140, 80]
svg = "shapes/note.svg"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5, opacity = 1.0 }

[[shape]]
id = "component"
name = "Component"
icon = "component"
default_size = [160, 100]
svg = "shapes/component.svg"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5, opacity = 1.0 }

[[shape]]
id = "actor"
name = "Actor"
icon = "user"
default_size = [40, 80]
svg = "shapes/actor.svg"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5, opacity = 1.0 }

# Relationships: one line part each, drawn left to right.

[[template]]
id = "association"
name = "Association"
icon = "minus"
default_size = [160, 1]

[[template.part]]
line = { from = [0, 0], to = [160, 0] }
style = { stroke = "auto", stroke_width = 1.5 }

[[template]]
id = "directed-association"
name = "Directed Association"
icon = "move-right"
default_size = [160, 1]

[[template.part]]
line = { from = [0, 0], to = [160, 0], end_head = "arrow" }
style = { stroke = "auto", stroke_width = 1.5 }

[[template]]
id = "generalization"
name = "Generalization"
icon = "shapes/icons/generalization.svg"
default_size = [160, 1]

[[template.part]]
line = { from = [0, 0], to = [160, 0], end_head = "hollow-triangle" }
style = { stroke = "auto", stroke_width = 1.5 }

[[template]]
id = "realization"
name = "Realization"
icon = "shapes/icons/realization.svg"
default_size = [160, 1]

[[template.part]]
line = { from = [0, 0], to = [160, 0], end_head = "hollow-triangle" }
style = { stroke = "auto", stroke_width = 1.5, dash = "dashed" }

[[template]]
id = "dependency"
name = "Dependency"
icon = "shapes/icons/dependency.svg"
default_size = [160, 1]

[[template.part]]
line = { from = [0, 0], to = [160, 0], end_head = "arrow" }
style = { stroke = "auto", stroke_width = 1.5, dash = "dashed" }

[[template]]
id = "aggregation"
name = "Aggregation"
icon = "shapes/icons/aggregation.svg"
default_size = [160, 1]

[[template.part]]
line = { from = [0, 0], to = [160, 0], start_head = "hollow-diamond" }
style = { stroke = "auto", stroke_width = 1.5 }

[[template]]
id = "composition"
name = "Composition"
icon = "shapes/icons/composition.svg"
default_size = [160, 1]

[[template.part]]
line = { from = [0, 0], to = [160, 0], start_head = "diamond" }
style = { stroke = "auto", stroke_width = 1.5 }

# Activity diagrams

[[shape]]
id = "action"
name = "Action"
icon = "rectangle-horizontal"
default_size = [140, 60]
primitive = "rect"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5, opacity = 1.0 }

[[shape.param]]
key = "corner_radius"
label = "Corner radius"
min = 0
max = 1000
step = 1
default = 14

[[shape]]
id = "initial-node"
name = "Initial Node"
icon = "shapes/icons/initial-node.svg"
default_size = [24, 24]
primitive = "ellipse"
style = { fill = "ink", stroke = "none", opacity = 1.0 }

[[template]]
id = "activity-final"
name = "Activity Final"
icon = "circle-dot"
default_size = [28, 28]

[[template.part]]
frame = [0, 0, 28, 28]
primitive = "ellipse"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5 }

[[template.part]]
frame = [6, 6, 16, 16]
primitive = "ellipse"
style = { fill = "ink", stroke = "none" }

[[shape]]
id = "flow-final"
name = "Flow Final"
icon = "circle-x"
default_size = [28, 28]
svg = "shapes/flow-final.svg"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5, opacity = 1.0 }

[[shape]]
id = "decision"
name = "Decision / Merge"
icon = "diamond"
default_size = [80, 50]
svg = "shapes/decision.svg"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5, opacity = 1.0 }

[[shape]]
id = "fork-join"
name = "Fork / Join"
icon = "shapes/icons/fork-join.svg"
default_size = [120, 6]
primitive = "rect"
style = { fill = "ink", stroke = "none", opacity = 1.0 }

[[shape]]
id = "send-signal"
name = "Send Signal"
icon = "shapes/icons/send-signal.svg"
default_size = [140, 60]
svg = "shapes/send-signal.svg"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5, opacity = 1.0 }

[[shape]]
id = "accept-event"
name = "Accept Event"
icon = "shapes/icons/accept-event.svg"
default_size = [140, 60]
svg = "shapes/accept-event.svg"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5, opacity = 1.0 }

[[shape]]
id = "object-node"
name = "Object Node"
icon = "square"
default_size = [120, 60]
primitive = "rect"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5, opacity = 1.0 }

[[template]]
id = "swimlane"
name = "Swimlane"
icon = "panel-top"
default_size = [240, 400]

[[template.part]]
frame = [0, 0, 240, 32]
primitive = "rect"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5 }
label = { text = "Lane", bold = true, size = 12 }

[[template.part]]
frame = [0, 32, 240, 368]
primitive = "rect"
style = { fill = "none", stroke = "auto", stroke_width = 1.5 }

[[template]]
id = "control-flow"
name = "Control Flow"
icon = "arrow-right"
default_size = [160, 1]

[[template.part]]
line = { from = [0, 0], to = [160, 0], end_head = "arrow" }
style = { stroke = "auto", stroke_width = 1.5 }

# Sequence diagrams

[[template]]
id = "lifeline"
name = "Lifeline"
icon = "shapes/icons/lifeline.svg"
default_size = [120, 280]

[[template.part]]
frame = [0, 0, 120, 40]
primitive = "rect"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5 }
label = { text = "object : Class", size = 12 }

[[template.part]]
line = { from = [60, 40], to = [60, 280] }
style = { stroke = "auto", stroke_width = 1.5, dash = "dashed" }

[[template]]
id = "actor-lifeline"
name = "Actor Lifeline"
icon = "shapes/icons/actor-lifeline.svg"
default_size = [120, 280]

[[template.part]]
frame = [30, 0, 60, 80]
svg = "shapes/actor-lifeline-head.svg"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5 }
label = { text = "actor", valign = "bottom", size = 12 }

[[template.part]]
line = { from = [60, 80], to = [60, 280] }
style = { stroke = "auto", stroke_width = 1.5, dash = "dashed" }

[[shape]]
id = "activation"
name = "Activation"
icon = "rectangle-vertical"
default_size = [12, 80]
primitive = "rect"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5, opacity = 1.0 }

[[template]]
id = "combined-fragment"
name = "Combined Fragment"
icon = "shapes/icons/combined-fragment.svg"
default_size = [280, 180]

[[template.part]]
frame = [0, 0, 280, 180]
primitive = "rect"
style = { fill = "none", stroke = "auto", stroke_width = 1.5 }

[[template.part]]
frame = [0, 0, 48, 20]
svg = "shapes/fragment-tag.svg"
style = { fill = "auto", stroke = "auto", stroke_width = 1.5 }
label = { text = "alt", align = "left", valign = "top", bold = true, size = 11 }

[[shape]]
id = "destruction"
name = "Destruction"
icon = "x"
default_size = [24, 24]
svg = "shapes/destruction.svg"
style = { fill = "none", stroke = "auto", stroke_width = 2, opacity = 1.0 }

[[template]]
id = "synchronous-message"
name = "Synchronous Message"
icon = "shapes/icons/synchronous-message.svg"
default_size = [160, 1]

[[template.part]]
line = { from = [0, 0], to = [160, 0], end_head = "triangle" }
style = { stroke = "auto", stroke_width = 1.5 }

[[template]]
id = "asynchronous-message"
name = "Asynchronous Message"
icon = "move-right"
default_size = [160, 1]

[[template.part]]
line = { from = [0, 0], to = [160, 0], end_head = "arrow" }
style = { stroke = "auto", stroke_width = 1.5 }

# A reply goes back to the caller, so it points left.
[[template]]
id = "reply-message"
name = "Reply Message"
icon = "shapes/icons/reply-message.svg"
default_size = [160, 1]

[[template.part]]
line = { from = [160, 0], to = [0, 0], end_head = "arrow" }
style = { stroke = "auto", stroke_width = 1.5, dash = "dashed" }
