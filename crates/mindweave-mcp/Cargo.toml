[package]
name = "mindweave-mcp"
description = "MCP server that lets AI agents build and edit Mindweave documents"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mindweave-mcp"
path = "src/main.rs"

[dependencies]
mindweave-core = { path = "../mindweave-core" }
base64.workspace = true
dirs.workspace = true
# Measures placed pictures (formats the app opens).
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
ratex-layout.workspace = true
ratex-parser.workspace = true
ratex-svg.workspace = true
ratex-types.workspace = true
resvg.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
